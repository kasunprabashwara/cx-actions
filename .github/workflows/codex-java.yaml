name: Test CodeX Java

on:
  workflow_call:
    inputs:
      team-name:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string
      machine_name:
        required: true
        type: string
    secrets:
      test-repo:
        required: true
      auth-token:
        required: true
      backend-url:
        required: true
      auth-key:
        required: true

jobs:
  test-bug-01:
    runs-on: ${{ inputs.machine_name }}
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.pr_head_sha }}

      - name: checkout tests
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.test-repo }}
          token: ${{ secrets.auth-token }}
          sparse-checkout: java
          sparse-checkout-cone-mode: false
          path: src/test/java/com/codejam/codex/authzen/

      - name: setup java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: setup maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: run test on bug 01
        shell: bash {0}
        run: |
          set +e
          mvn -Dtest=JwtServiceTest#BUG002 test > /dev/null 2>&1
          result=$?
          if [ ${result} -ne 0 ]; then
              echo "FAILED"
          else
            echo "PASSED"
            curl -X POST ${{ secrets.backend-url }} \
            -H "Content-Type: application/json" \
            -H "x-webhook-token: ${{ secrets.auth-key }}" \
            -d '{
                "tablePrefix":"uni_",
                "teamName": "${{ inputs.team-name }}",
                "bugCode": "BUG-002"
            }'
          fi
          exit ${result}

