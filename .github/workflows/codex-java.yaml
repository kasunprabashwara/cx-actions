      - name: setup maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: run test on bug 33
        shell: bash {0}
        run: |
          set +e
          mvn -Dtest=SecurityConfigurationTest#BUG034 test > /dev/null 2>&1
          result=$?
          if [ ${result} -ne 0 ]; then
              echo "FAILED"
          else
            echo "PASSED"
            curl -X POST ${{ secrets.backend-url }} \
            -H "Content-Type: application/json" \
            -H "x-webhook-token: ${{ secrets.auth-key }}" \
            -d '{
                "tablePrefix":"uni_",
                "teamName": "${{ inputs.team-name }}",
                "bugCode": "BUG-034"
            }'
          fi
          exit ${result}